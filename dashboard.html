<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskPilot</title>
<style>
  :root{
    --bg:#11131a; --panel:#181b24; --panel2:#1f2330; --line:#2a2f3d;
    --ink:#e8e9ee; --mut:#9aa0b0; --faint:#6b7180;
    --accent:#8b7bf0; --amber:#e8a13a; --red:#e06464; --teal:#46c2a0; --pink:#e07aa6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f6f3; --panel:#ffffff; --panel2:#fbfbf9; --line:#e6e5df;
           --ink:#22242b; --mut:#5f626d; --faint:#9a9da8; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       line-height:1.5;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:22px 28px;border-bottom:1px solid var(--line)}
  header h1{font-size:17px;font-weight:600;letter-spacing:.02em;margin:0}
  header h1 span{color:var(--accent)}
  .meta{font-family:var(--mono);font-size:12.5px;color:var(--mut)}
  main{max-width:1100px;margin:0 auto;padding:24px 28px 64px;
    display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .wide{grid-column:1 / -1}
  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .head{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .head .tag{width:8px;height:8px;border-radius:50%}
  .head h2{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--mut);margin:0}
  .head .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}
  ul{list-style:none;margin:0;padding:6px 0}
  li{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
  li:last-child{border-bottom:none}
  .id{font-family:var(--mono);font-size:11.5px;color:var(--faint);padding-top:2px;min-width:30px}
  .title{font-size:14.5px}
  .sub{font-family:var(--mono);font-size:11.5px;color:var(--mut);margin-top:3px}
  .who{color:var(--pink)}
  .empty{padding:18px 16px;color:var(--faint);font-size:13.5px}
  .edge-amber{border-left:3px solid var(--amber)}
  .edge-red{border-left:3px solid var(--red)}
  pre.log{margin:0;padding:14px 16px;white-space:pre-wrap;font-family:var(--mono);
    font-size:12.5px;color:var(--mut);line-height:1.7}
  .gate{max-width:420px;margin:18vh auto;text-align:center;color:var(--mut);padding:0 24px}
  @media (max-width:720px){ main{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Task<span>Pilot</span></h1>
  <div class="meta" id="clock"></div>
</header>
<main id="root">
  <section class="wide"><div class="empty">Loading…</div></section>
</main>

<script>
const COLORS={overdue:"var(--red)",start_today:"var(--amber)",due_soon:"var(--teal)",
  commitments:"var(--pink)",ideas:"var(--accent)",other:"var(--faint)"};
const TITLES={overdue:"Overdue",start_today:"Start today",due_soon:"Due soon",
  commitments:"Commitments",ideas:"Ideas",other:"Everything else"};
const EDGE={overdue:"edge-red",start_today:"edge-amber"};

function token(){ return new URLSearchParams(location.search).get("token")||""; }

function tick(){
  const d=new Date();
  document.getElementById("clock").textContent=
    d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"})
    +" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}

function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function itemLi(it,key){
  const cls=EDGE[key]?` class="${EDGE[key]}"`:"";
  let sub=[];
  if(it.due_fmt) sub.push("due "+esc(it.due_fmt));
  if(it.effort_min) sub.push("~"+Math.round(it.effort_min/60*10)/10+"h");
  const who=it.person?` <span class="who">· ${esc(it.person)}</span>`:"";
  return `<li${cls}><span class="id">#${it.id}</span><div>
    <div class="title">${esc(it.title)}${who}</div>
    ${sub.length?`<div class="sub">${sub.join(" · ")}</div>`:""}
  </div></li>`;
}

function sectionHTML(key,items){
  const body = items.length
    ? `<ul>${items.map(i=>itemLi(i,key)).join("")}</ul>`
    : `<div class="empty">Nothing here.</div>`;
  return `<section>
    <div class="head"><span class="tag" style="background:${COLORS[key]}"></span>
      <h2>${TITLES[key]}</h2><span class="count">${items.length}</span></div>
    ${body}</section>`;
}

async function load(){
  if(!token()){ document.getElementById("root").innerHTML=
    `<div class="gate">Add your access token to the URL: <code>?token=…</code></div>`; return; }
  try{
    const r=await fetch("/api/items?token="+encodeURIComponent(token()));
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    const b=data.buckets;
    const order=["overdue","start_today","due_soon","commitments","ideas","other"];
    let html=order.filter(k=>b[k] && (b[k].length||k==="start_today"))
                  .map(k=>sectionHTML(k,b[k])).join("");
    html+=`<section class="wide">
      <div class="head"><span class="tag" style="background:var(--teal)"></span>
        <h2>This week</h2></div>
      <pre class="log">${esc(data.timelog).replace(/<\/?b>/g,"")}</pre></section>`;
    document.getElementById("root").innerHTML=html;
  }catch(e){
    document.getElementById("root").innerHTML=
      `<div class="gate">Couldn't load (${e.message}). Check your token.</div>`;
  }
}
tick(); setInterval(tick,1000);
load(); setInterval(load,60000);
</script>
</body>
</html>
